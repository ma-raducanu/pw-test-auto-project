name: The Internet
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/the-internet.yml'
      - 'fixtures/the-internet/**'
      - 'page-objects/the-internet/**'
      - 'tests/the-internet/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/the-internet.yml'
      - 'fixtures/the-internet/**'
      - 'page-objects/the-internet/**'
      - 'tests/the-internet/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test tests/the-internet
      env:
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-the-internet
        path: playwright-report/the-internet
        retention-days: 30
