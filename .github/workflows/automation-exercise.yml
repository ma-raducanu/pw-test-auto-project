name: Automation Exercise
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/automation-exercise.yml'
      - '0-utils/automation-exercise/**'
      - '1-page-objects/automation-exercise/**'
      - '2-fixtures/automation-exercise/**'
      - '3-tests/automation-exercise/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/automation-exercise.yml'
      - '0-utils/automation-exercise/**'
      - '1-page-objects/automation-exercise/**'
      - '2-fixtures/automation-exercise/**'
      - '3-tests/automation-exercise/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test 3-tests/automation-exercise
      # env:
      #   TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      #   TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-automation-exercise
        path: playwright-report/automation-exercise
        retention-days: 30
